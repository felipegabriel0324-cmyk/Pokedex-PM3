<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Pokedex</title>
		<link rel="stylesheet" href="css/header.css">
		<link rel="stylesheet" href="css/filtro.css">
		<script src="js/script.js" defer></script>
	</head>
	<body>
		<header>
			<div class="titulo">
				<img class="logo" src="images/logo.svg" alt="logo da pokedex">
				<div class="M-1">
					<h1 class="titulo-h1">POKEDEX</h1>
					<div class="bolas">
						<span class="bola-vermelha"></span>
						<span class="bola-amarela"></span>
						<span class="bola-verde"></span>
					</div>
				</div>
			</div>
				<input class="campo-busca" id="campo-busca" type="search" placeholder="pesquisa...">
			<div>
				<h1 class="minhapokedex">MINHA POKEDEX</h1>
			</div>
		</header>
		<div class="filtro">
			<a class="text-type">TYPE:</a>
			<button class="tipo">ALL</button>
			<button class="tipo">NORMAL</button>
			<button class="tipo">FIRE</button>
			<button class="tipo">WATER</button>
			<button class="tipo">GRASS</button>
			<button class="tipo">FLYING</button>
			<button class="tipo">FIGHTING</button>
			<button class="tipo">POISON</button>
			<button class="tipo">ELECTRIC</button>
			<button class="tipo">GROUND</button>
			<button class="tipo">ROCK</button>
			<button class="tipo">PSYCHIC</button>
			<button class="tipo">ICE</button>
			<button class="tipo">BUG</button>
			<button class="tipo">GHOST</button>
			<button class="tipo">STEEL</button>
			<button class="tipo">DRAGON</button>
			<button class="tipo">DARK</button>
			<button class="tipo">FAIRY</button>
		</div>
	</body>
</html>
