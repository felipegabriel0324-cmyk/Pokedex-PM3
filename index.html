<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Pokedex</title>
		<link rel="stylesheet" href="css/header.css">
		<link rel="stylesheet" href="css/filtro.css">
		<link rel="stylesheet" href="css/cards.css">
		<script src="js/tipoStyle.js" defer></script>
		<script src="js/main.js" defer></script>
		<script src="js/tipoScript.js" defer></script>
	</head>
	<body>
		<header>
			<div class="titulo">
				<img class="logo" src="images/logo.svg" alt="logo da pokedex">
				<div class="M-1">
					<h1 class="titulo-h1">POKEDEX</h1>
					<div class="bolas">
						<span class="bola-vermelha"></span>
						<span class="bola-amarela"></span>
						<span class="bola-verde"></span>
					</div>
				</div>
			</div>
				<input class="campo-busca" id="campo-busca" type="search" placeholder="pesquisa...">
			<div>
				<button id="irParaDex" class="minhapokedex">MINHA POKEDEX</button>
			</div>
		</header>
		<div id="tipo_script" class="filtro">
			<a class="text-type">TYPE:</a>
			<button class="tipo">ALL</button>
			<button class="tipo" data-tipo="fav">FAVORITES</button>
			<button class="tipo" data-tipo="nor">NORMAL</button>
			<button class="tipo" data-tipo="fir">FIRE</button>
			<button class="tipo" data-tipo="wat">WATER</button>
			<button class="tipo" data-tipo="gra">GRASS</button>
			<button class="tipo" data-tipo="fly">FLYING</button>
			<button class="tipo" data-tipo="fig">FIGHTING</button>
			<button class="tipo" data-tipo="poi">POISON</button>
			<button class="tipo" data-tipo="ele">ELECTRIC</button>
			<button class="tipo" data-tipo="gro">GROUND</button>
			<button class="tipo" data-tipo="roc">ROCK</button>
			<button class="tipo" data-tipo="psy">PSYCHIC</button>
			<button class="tipo" data-tipo="ice">ICE</button>
			<button class="tipo" data-tipo="bug">BUG</button>
			<button class="tipo" data-tipo="gho">GHOST</button>
			<button class="tipo" data-tipo="ste">STEEL</button>
			<button class="tipo" data-tipo="dra">DRAGON</button>
			<button class="tipo" data-tipo="dar">DARK</button>
			<button class="tipo" data-tipo="fai">FAIRY</button>
		</div>
		<div class="tipo-separador">
		</div>
		<main class="card-box" id="pokedex-container">
		</main>
		<div class="selecao" id ="selecao_script">
			<button class="selecao_estilo" data-numero="1">1</button>
			<button class="selecao_estilo" data-numero="2">2</button>
			<button class="selecao_estilo" data-numero="3">3</button>
			<button class="selecao_estilo" data-numero="4">4</button>
			<button class="selecao_estilo" data-numero="5">5</button>
			<button class="selecao_estilo" data-numero="6">6</button>
			<button class="selecao_estilo" data-numero="7">7</button>
		</div>
	</body>
</html>
